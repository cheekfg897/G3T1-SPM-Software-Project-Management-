<text x="186.0" y="314" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Open</text>
<text x="186.0" y="328" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">notifications</text>
<line x1="241.5" y1="358" x2="544" y2="358" stroke="#be123c" stroke-width="1.8" marker-end="url(#arrow-be123c)"/>
<text x="392.75" y="350" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="700">GET</tspan> /api/notifications</text>
