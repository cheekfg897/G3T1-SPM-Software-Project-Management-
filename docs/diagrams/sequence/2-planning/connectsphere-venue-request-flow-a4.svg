<line x1="50" y1="320" x2="232" y2="320" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-7c3aed)"/>
<text x="141.0" y="313" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Request a venue booking</text>
<line x1="241.5" y1="343" x2="544" y2="343" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-7c3aed)"/>
<text x="392.75" y="335" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="700">POST</tspan> /api/venues/events/:reference/booking-requests</text>
