<text x="182.0" y="506" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Open</text>
<text x="182.0" y="520" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">notifications</text>
<line x1="241.5" y1="550" x2="544" y2="550" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow-0f766e)"/>
<text x="392.75" y="542" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="700">GET</tspan> /api/notifications</text>
