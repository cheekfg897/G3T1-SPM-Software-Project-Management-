<text x="232" y="553.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">9</text>
<line x1="534.5" y1="576" x2="232" y2="576" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-0369a1)"/>
<text x="383.25" y="568" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">A venue booking request awaits a decision</text>
<circle cx="544" cy="576" r="9.5" fill="#0369a1"/>
<text x="544" y="579.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">10</text>
