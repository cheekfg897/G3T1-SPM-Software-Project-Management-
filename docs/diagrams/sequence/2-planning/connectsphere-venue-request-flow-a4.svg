<circle cx="544" cy="177" r="9.5" fill="#0369a1"/>
<text x="544" y="180.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">2</text>
<line x1="232" y1="202" x2="50" y2="202" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-7c3aed)"/>
<text x="141.0" y="195" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Show the venues</text>
<line x1="50" y1="224" x2="232" y2="224" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-7c3aed)"/>
<text x="141.0" y="217" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Check suitability</text>
<line x1="241.5" y1="247" x2="544" y2="247" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-7c3aed)"/>
<text x="392.75" y="239" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="700">POST</tspan> /api/venues/:id/suitability</text>
<circle cx="232" cy="247" r="9.5" fill="#7c3aed"/>
<text x="232" y="250.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">3</text>
