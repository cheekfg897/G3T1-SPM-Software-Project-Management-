<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
<defs><marker id="arrow-0369a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker><marker id="arrow-15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrow-a16207" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="794" height="1123" fill="#fff"/>
<text x="12" y="20" font-size="15" font-weight="700" fill="#111827">ConnectSphere: coordinator confirms the event</text>
<line x1="50" y1="70" x2="50" y2="467" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="144" y1="70" x2="144" y2="467" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="232" y1="70" x2="232" y2="467" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="544" y1="70" x2="544" y2="467" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="748" y1="70" x2="748" y2="467" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="12" y="82" width="770" height="22" rx="4" fill="#e5e7eb"/>
<text x="22" y="97.5" font-size="13" font-weight="700" fill="#111827">Coordinator confirms the event (it must be in Safety Review, with every approval in)</text>
<rect x="12" y="315" width="770" height="22" rx="4" fill="#e5e7eb"/>
<text x="22" y="330.5" font-size="13" font-weight="700" fill="#111827">Later, the Web App fetches the organiser&#x27;s saved notifications (nothing is pushed)</text>
<line x1="50" y1="128" x2="232" y2="128" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-7c3aed)"/>
<text x="141.0" y="121" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Confirm the event</text>
<line x1="241.5" y1="151" x2="544" y2="151" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-7c3aed)"/>
<text x="392.75" y="143" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="700">POST</tspan> /api/events/requests/:reference/confirm</text>
<circle cx="232" cy="151" r="9.5" fill="#7c3aed"/>
<text x="232" y="154.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">1</text>
<line x1="553.5" y1="205" x2="748" y2="205" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arrow-0369a1)"/>
<text x="650.75" y="169" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Check: Safety Officer approved,</text>
<text x="650.75" y="183" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">venues approved and booked,</text>
<text x="650.75" y="197" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">equipment outcomes recorded</text>
<circle cx="544" cy="205" r="9.5" fill="#0369a1"/>
<text x="544" y="208.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">2</text>
<line x1="553.5" y1="231" x2="748" y2="231" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arrow-0369a1)"/>
<text x="650.75" y="223" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Status becomes confirmed</text>
<circle cx="544" cy="231" r="9.5" fill="#0369a1"/>
<text x="544" y="234.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">3</text>
<line x1="553.5" y1="257" x2="748" y2="257" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arrow-0369a1)"/>
<text x="650.75" y="249" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Save notification: organiser</text>
<circle cx="544" cy="257" r="9.5" fill="#0369a1"/>
<text x="544" y="260.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">4</text>
<line x1="534.5" y1="283" x2="232" y2="283" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-0369a1)"/>
<text x="383.25" y="275" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">The request, now confirmed</text>
<circle cx="544" cy="283" r="9.5" fill="#0369a1"/>
<text x="544" y="286.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">5</text>
<line x1="232" y1="308" x2="50" y2="308" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-7c3aed)"/>
<text x="141.0" y="301" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Show the request</text>
<line x1="144" y1="375" x2="232" y2="375" stroke="#a16207" stroke-width="1.8" marker-end="url(#arrow-a16207)"/>
<text x="188.0" y="354" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Open</text>
<text x="188.0" y="368" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">notifications</text>
<line x1="241.5" y1="398" x2="544" y2="398" stroke="#a16207" stroke-width="1.8" marker-end="url(#arrow-a16207)"/>
<text x="392.75" y="390" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="700">GET</tspan> /api/notifications</text>
<circle cx="232" cy="398" r="9.5" fill="#a16207"/>
<text x="232" y="401.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">6</text>
<line x1="534.5" y1="424" x2="232" y2="424" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-0369a1)"/>
<text x="383.25" y="416" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Your event has been confirmed</text>
<circle cx="544" cy="424" r="9.5" fill="#0369a1"/>
<text x="544" y="427.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">7</text>
<line x1="232" y1="463" x2="144" y2="463" stroke="#a16207" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-a16207)"/>
<text x="188.0" y="442" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Show</text>
<text x="188.0" y="456" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">notifications</text>
<rect x="8.0" y="30" width="84" height="40" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2.2"/>
<text x="50" y="47" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Event</text>
