<text x="650.75" y="169" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Status becomes safety_review</text>
<circle cx="544" cy="177" r="9.5" fill="#0369a1"/>
<text x="544" y="180.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">2</text>
