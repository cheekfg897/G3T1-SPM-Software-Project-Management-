<rect width="794" height="1123" fill="#fff"/>
<text x="12" y="20" font-size="15" font-weight="700" fill="#111827">ConnectSphere: send an event for a safety check</text>
<line x1="50" y1="70" x2="50" y2="568" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="140" y1="70" x2="140" y2="568" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="232" y1="70" x2="232" y2="568" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="544" y1="70" x2="544" y2="568" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="748" y1="70" x2="748" y2="568" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="12" y="82" width="770" height="22" rx="4" fill="#e5e7eb"/>
<text x="22" y="97.5" font-size="13" font-weight="700" fill="#111827">Send an Approved event to Safety Review (its venues and equipment must be settled)</text>
<rect x="12" y="275" width="770" height="22" rx="4" fill="#e5e7eb"/>
<text x="22" y="290.5" font-size="13" font-weight="700" fill="#111827">Later, the Web App fetches the Safety Officers&#x27; saved notifications (nothing is pushed)</text>
<rect x="12" y="430" width="770" height="22" rx="4" fill="#e5e7eb"/>
<text x="22" y="445.5" font-size="13" font-weight="700" fill="#111827">Safety Officer opens the events in Safety Review</text>
<line x1="50" y1="128" x2="232" y2="128" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-7c3aed)"/>
<text x="141.0" y="121" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Send for safety check</text>
<line x1="241.5" y1="151" x2="544" y2="151" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-7c3aed)"/>
<text x="392.75" y="143" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="700">POST</tspan> /api/events/requests/:reference/safety-review</text>
<circle cx="232" cy="151" r="9.5" fill="#7c3aed"/>
<text x="232" y="154.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">1</text>
