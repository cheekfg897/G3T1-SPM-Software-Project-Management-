<line x1="140" y1="476" x2="232" y2="476" stroke="#be123c" stroke-width="1.8" marker-end="url(#arrow-be123c)"/>
<text x="186.0" y="469" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Open the list</text>
<line x1="241.5" y1="499" x2="544" y2="499" stroke="#be123c" stroke-width="1.8" marker-end="url(#arrow-be123c)"/>
