<text x="22" y="97.5" font-size="13" font-weight="700" fill="#111827">Organiser submits an event request (their account must belong to a client organisation)</text>
<rect x="12" y="289" width="770" height="22" rx="4" fill="#e5e7eb"/>
<text x="22" y="304.5" font-size="13" font-weight="700" fill="#111827">Later, the Web App fetches the Lead&#x27;s saved notifications (nothing is pushed)</text>
<rect x="12" y="416" width="770" height="22" rx="4" fill="#e5e7eb"/>
<text x="22" y="431.5" font-size="13" font-weight="700" fill="#111827">Lead opens the unassigned queue (Lead only)</text>
<rect x="12" y="543" width="770" height="22" rx="4" fill="#e5e7eb"/>
<text x="22" y="558.5" font-size="13" font-weight="700" fill="#111827">Lead assigns a coordinator (the request must be waiting in the queue)</text>
<rect x="12" y="790" width="770" height="22" rx="4" fill="#e5e7eb"/>
<text x="22" y="805.5" font-size="13" font-weight="700" fill="#111827">Later, the Web App fetches the coordinator&#x27;s and organiser&#x27;s saved notifications (nothing is pushed)</text>
