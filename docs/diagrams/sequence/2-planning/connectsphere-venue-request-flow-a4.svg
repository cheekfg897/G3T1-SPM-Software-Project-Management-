<text x="650.75" y="401" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">all Venue Staff</text>
<circle cx="544" cy="409" r="9.5" fill="#0369a1"/>
<text x="544" y="412.7" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">7</text>
<line x1="534.5" y1="435" x2="232" y2="435" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-0369a1)"/>
<text x="383.25" y="427" text-anchor="middle" font-size="12.5" fill="#111827" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">The new request (pending)</text>
