<text x="12" y="722" font-size="12" fill="#6b7280">Dashed arrow: a response. Arrows into PostgreSQL: what is saved. Arrows with no number: what the person does or sees in the Web App.</text>
<text x="12" y="738" font-size="12" fill="#6b7280">Approved: the coordinator accepts the request so planning can start. The event is confirmed later, after the Safety Review.</text>
