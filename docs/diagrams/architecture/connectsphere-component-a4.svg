<text x="578" y="151.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Calls each module&#x27;s routes</text>
<text x="578" y="164.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[JSON over HTTP, Bearer JWT]</text>
<polyline points="462,950 462,984" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="528" y="964.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Reads and writes</text>
<text x="528" y="977.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[SQLAlchemy, psycopg2]</text>
<polyline points="326,272 412,272" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="369.0" y="247.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Looks up the</text>
<text x="369.0" y="260.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">organisation</text>
<polyline points="412,414 326,530" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="369.0" y="469.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Reads venue</text>
<text x="369.0" y="482.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">details</text>
<polyline points="412,556 326,556" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="369.0" y="536.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Lists booked</text>
<text x="369.0" y="549.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">venues</text>
<polyline points="326,582 412,698" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="369.0" y="637.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Saves</text>
<text x="369.0" y="650.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">notifications</text>
<polyline points="626,530 540,414" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="583.0" y="469.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Reservations,</text>
<text x="583.0" y="482.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">equipment need</text>
<polyline points="626,556 540,556" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="583.0" y="536.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Registrations,</text>
<text x="583.0" y="549.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">and events</text>
<polyline points="626,582 540,698" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="583.0" y="637.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Saves</text>
<text x="583.0" y="650.5" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">notifications</text>
<polyline points="262.0,612 262.0,792 690.0,792 690.0,612" fill="none" stroke="#707070" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="476.0" y="796.0" text-anchor="middle" font-size="10.5" fill="#333333" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Arrangements and the event record</text>
<text x="12" y="996" font-size="10" fill="#6b7280" >Arrow A → B: A calls B&#x27;s service functions,</text>
<text x="12" y="1009" font-size="10" fill="#6b7280" >in the same process (no network hop).</text>
<text x="12" y="1022" font-size="10" fill="#6b7280" >Not drawn: every module&#x27;s calls into auth</text>
<text x="12" y="1035" font-size="10" fill="#6b7280" >(roles, user lookups) and the shared kernel.</text>
